[package]
name = "identstr"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Immutable identifier strings with preserved quote style and normalized lookup keys."
license = "MIT"
repository = "https://github.com/themixednuts/identstr"
readme = "README.md"
keywords = ["identifier", "case-insensitive", "sql", "unicode"]
categories = ["data-structures", "parser-implementations", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[features]
default = []
serde = ["dep:serde"]
unicode = [
    "dep:caseless",
    "dep:unicode-normalization",
    "dep:unicode-security",
]
unicode-turkic = ["unicode", "dep:icu_casemap"]

[dependencies]
caseless = { version = "0.2.2", optional = true }
icu_casemap = { version = "2.2.0", optional = true }
serde = { version = "1.0", optional = true }
unicode-normalization = { version = "0.1.25", optional = true }
unicode-security = { version = "0.1.2", optional = true }

[dev-dependencies]
compact_str = "0.9.0"
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
    "html_reports",
    "plotters",
] }
serde_json = "1.0"
static_assertions = "1.1"
uncased = "0.9.10"

[[bench]]
name = "identstr"
harness = false
path = "benches/identstr/main.rs"
